# HIL Bench Controller — Configuration Template
# Copy to /etc/hil-bench/config.yaml and customize for your bench.
# Override path via --config flag or HIL_BENCH_CONFIG env var.

bench_name: my-bench-01          # unique bench identifier
hostname: my-bench-01            # optional — set by bootstrap

runner:
  labels:
    - self-hosted
    - linux
    - ARM64
    - hil
    # Add target-specific labels, e.g.:
    # - samd51
    # - bench01

targets:
  # Each key is a target name used with --target flag
  my_target:
    family: samd51               # MCU family
    probe:
      type: edbg                 # edbg or openocd
      device_path: /dev/atmel-ice-0
      serial_number: null        # optional — for multi-probe setups
    serial:
      device_path: /dev/serial/by-id/usb-FTDI-if00
      baud_rate: 115200
      timeout: 1.0
    gpio:
      reset: { line: 17 }
      ready: { line: 27 }
      fault: { line: 22 }
    power:
      type: none                 # none or relay
      relay_pin: null            # e.g. { line: 4 } if type=relay

  # Example: Grand Central M4 with native USB CDC serial
  # grand_central_m4:
  #   family: samd51
  #   probe:
  #     type: edbg
  #     device_path: /dev/atmel-ice-0
  #   serial:
  #     device_path: /dev/serial/by-id/usb-Miniscope_Miniscope_CDC_*-if00  # unique per MCU
  #     baud_rate: 115200
  #     timeout: 1.0
  #   gpio:
  #     reset: { line: 17 }
  #     ready: { line: 27 }
  #     fault: { line: 22 }
  #   power:
  #     type: none

  # Example: custom ESP32-C6 board with native USB Serial/JTAG (no USB-UART chip).
  # One port (VID:PID 303a:1001) is both the esptool flash port and the console.
  # It disappears and re-enumerates after flashing; benchctl waits for it.
  # See docs/esp32-targets.md. UNTESTED on hardware.
  # esp32c6_receiver:
  #   family: esp32c6
  #   probe:
  #     type: esptool            # needs the "esp" extra (esptool>=5)
  #     device_path: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_*-if00  # glob; resolved at use
  #     chip: esp32c6            # default
  #     baud: 460800             # default; flash transfer speed
  #     flash_offset: "0x0"      # default; merged image (bootloader+ptable+app) goes at 0x0 on C6
  #   serial:
  #     device_path: /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_*-if00
  #     baud_rate: 115200        # cosmetic on USB CDC
  #     timeout: 1.0
  #   gpio:                      # Pi lines are 3.3 V, same as the ESP32-C6: no level shifting
  #     hv_dis: { line: 5 }      # INPUT: DUT HV_DIS net; HIGH = APD high-voltage supply is OFF
  #     reset: { line: 6 }       # drives DUT EN low via a transistor (open-drain style)
  #     boot: { line: 13 }       # drives BOOT/IO9 low via a transistor
  #     fault: { line: 19 }      # INPUT: DUT fault output
  #   power:
  #     type: relay
  #     relay_pin: { line: 26 }  # example line; relay switches the DUT 5 V

paths:
  workspace: /opt/hil-bench
  log_dir: /var/log/hil-bench

wiki:
  canonical_url: null            # optional wiki link

led:
  enabled: false                 # set to true to enable WS2812B LED strip
  led_count: 16                  # number of LEDs on the strip
  gpio_pin: 18                   # GPIO pin (PWM0)
  brightness: 128                # default brightness (0-255)
  fps: 30                        # animation frame rate
  socket_path: /run/hil-bench/led.sock
